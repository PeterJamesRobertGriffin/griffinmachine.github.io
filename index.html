<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Griffin Machine</title>

  <style>
    /* =========================================================
       BASE
    ========================================================= */

    body {
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      transition: background 0.8s ease-in-out;
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      overflow-x: hidden;
    }

    /* =========================================================
       NORMAL BACKGROUNDS
    ========================================================= */

    body.family_guy {
      background-color: #0074D9;
      background-image: url("images/bg_family_guy.jpg");
      background-position: center bottom;
    }

    body.cleveland_show {
      background-color: #FFDC00;
      color: #111;
      background-image: url("images/bg_cleveland.jpg");
      background-position: center bottom;
    }

    body.custom {
      background-color: #005c22;
      color: #111;
      background-image: url("images/bg_custom.jpg");
      background-position: center bottom;
    }

    /* =========================================================
       RETEP BACKGROUND
    ========================================================= */

    body.retep {
      background-color: #000;

      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.25),
          rgba(0, 0, 0, 0.25)
        ),
        url("images/bg_retep.jpg");

      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;

      animation:
        retepBackgroundShake 0.08s infinite,
        retepBackgroundFlicker 0.13s infinite alternate;
    }

    @keyframes retepBackgroundShake {
      0% {
        background-position: calc(50% - 3px) calc(100% + 2px);
      }

      20% {
        background-position: calc(50% + 4px) calc(100% - 3px);
      }

      40% {
        background-position: calc(50% - 5px) calc(100% + 4px);
      }

      60% {
        background-position: calc(50% + 3px) calc(100% + 5px);
      }

      80% {
        background-position: calc(50% - 4px) calc(100% - 2px);
      }

      100% {
        background-position: calc(50% + 2px) calc(100% + 3px);
      }
    }

    @keyframes retepBackgroundFlicker {
      0% {
        filter: brightness(0.75) contrast(1.15) saturate(1.1);
      }

      10% {
        filter: brightness(1.05) contrast(1.5) saturate(1.6);
      }

      11% {
        filter: brightness(0.3) contrast(2) saturate(2);
      }

      22% {
        filter: brightness(0.85) contrast(1.3) saturate(1.3);
      }

      34% {
        filter: brightness(1.15) contrast(1.7) saturate(1.8);
      }

      35% {
        filter: brightness(0.2) contrast(2.2) saturate(2);
      }

      50% {
        filter: brightness(0.8) contrast(1.4) saturate(1.5);
      }

      63% {
        filter: brightness(1.1) contrast(1.7) saturate(1.8);
      }

      64% {
        filter: brightness(0.35) contrast(2) saturate(2);
      }

      80% {
        filter: brightness(0.7) contrast(1.4) saturate(1.5);
      }

      100% {
        filter: brightness(0.6) contrast(1.5) saturate(1.6);
      }
    }

    /* =========================================================
       LOGO
    ========================================================= */

    #siteLogo {
      width: 507px;
      max-width: 63vw;
      height: auto;
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      pointer-events: none;

      filter:
        drop-shadow(0 5px 10px rgba(0, 0, 0, 0.9))
        drop-shadow(0 0 15px rgba(0, 0, 0, 0.6));

      transition:
        opacity 0.25s ease,
        filter 0.25s ease;
    }

    body.retep #siteLogo {
      animation: retepLogoGlitch 0.1s infinite alternate;
    }

    @keyframes retepLogoGlitch {
      from {
        transform: translateX(calc(-50% - 2px)) skewX(-1deg);
      }

      to {
        transform: translateX(calc(-50% + 2px)) skewX(1deg);
      }
    }

    /* =========================================================
       MAIN CONTAINER
    ========================================================= */

    .container {
      background: transparent;
      padding: 160px 30px 20px;
      text-align: center;
      color: #fff;
      max-width: 540px;
      width: 92%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 5;
    }

    /* =========================================================
       CHARACTER SELECT
    ========================================================= */

    .character-select {
      position: fixed;
      left: 25px;
      right: auto;
      top: 50%;
      transform: translateY(-50%);

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;

      gap: 20px;
      margin: 0;
      z-index: 60;
      pointer-events: none;
    }

    .char-head {
      width: 110px;
      height: 110px;
      flex-shrink: 0;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
      pointer-events: auto;

      position: relative;
      z-index: 70;

      border: 1px solid rgba(0, 0, 0, 0.45);
      background: rgba(20, 20, 20, 0.083);

      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);

      filter:
        drop-shadow(0 0 10px rgba(0, 0, 0, 0.364))
        drop-shadow(0 8px 16px rgba(0, 0, 0, 1));

      transition:
        border-color 0.3s ease,
        filter 0.3s ease;

      opacity: 1;
    }

    .char-head:hover {
      transform: scale(1.15);

      filter:
        drop-shadow(0 0 14px rgba(0, 0, 0, 1))
        drop-shadow(0 12px 24px rgba(0, 0, 0, 1));
    }

    .char-head.active {
      border-color: rgba(255, 255, 255, 0.8);

      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.35),
        0 0 12px rgba(255, 255, 255, 0.28),
        0 0 22px rgba(255, 255, 255, 0.18);

      filter:
        drop-shadow(0 0 10px rgba(0, 0, 0, 0.364))
        drop-shadow(0 0 18px rgba(255, 255, 255, 0.32))
        drop-shadow(0 8px 16px rgba(0, 0, 0, 1));
    }

    /* =========================================================
       CHARACTER SLIDE SYSTEM
    ========================================================= */

    .character-select.side-right {
      left: auto;
      right: 25px;
    }

    .character-select.transitioning {
      pointer-events: none;
    }

    /* ENTER FROM LEFT */

    .character-select.enter-left .char-head {
      animation-name: characterEnterLeft;
      animation-duration: 0.48s;
      animation-timing-function: cubic-bezier(0.2, 0.9, 0.25, 1);
      animation-fill-mode: both;
    }

    .character-select.enter-left .char-head:nth-child(1) {
      animation-delay: 0s;
    }

    .character-select.enter-left .char-head:nth-child(2) {
      animation-delay: 0.12s;
    }

    .character-select.enter-left .char-head:nth-child(3) {
      animation-delay: 0.24s;
    }

    @keyframes characterEnterLeft {
      from {
        opacity: 0;
        transform: translateX(-140vw) scale(0.8);
      }

      70% {
        opacity: 1;
      }

      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    /* ENTER FROM RIGHT */

    .character-select.enter-right .char-head {
      animation-name: characterEnterRight;
      animation-duration: 0.48s;
      animation-timing-function: cubic-bezier(0.2, 0.9, 0.25, 1);
      animation-fill-mode: both;
    }

    .character-select.enter-right .char-head:nth-child(1) {
      animation-delay: 0s;
    }

    .character-select.enter-right .char-head:nth-child(2) {
      animation-delay: 0.12s;
    }

    .character-select.enter-right .char-head:nth-child(3) {
      animation-delay: 0.24s;
    }

    @keyframes characterEnterRight {
      from {
        opacity: 0;
        transform: translateX(140vw) scale(0.8);
      }

      70% {
        opacity: 1;
      }

      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    /* EXIT TO LEFT */

    .character-select.exit-left .char-head {
      animation-name: characterExitLeft;
      animation-duration: 0.38s;
      animation-timing-function: cubic-bezier(0.65, 0, 0.85, 0.2);
      animation-fill-mode: forwards;
    }

    .character-select.exit-left .char-head:nth-child(1) {
      animation-delay: 0s;
    }

    .character-select.exit-left .char-head:nth-child(2) {
      animation-delay: 0.08s;
    }

    .character-select.exit-left .char-head:nth-child(3) {
      animation-delay: 0.16s;
    }

    @keyframes characterExitLeft {
      from {
        opacity: 1;
        transform: translateX(0) scale(1);
      }

      to {
        opacity: 0;
        transform: translateX(-140vw) scale(0.8);
      }
    }

    /* EXIT TO RIGHT */

    .character-select.exit-right .char-head {
      animation-name: characterExitRight;
      animation-duration: 0.38s;
      animation-timing-function: cubic-bezier(0.65, 0, 0.85, 0.2);
      animation-fill-mode: forwards;
    }

    .character-select.exit-right .char-head:nth-child(1) {
      animation-delay: 0s;
    }

    .character-select.exit-right .char-head:nth-child(2) {
      animation-delay: 0.08s;
    }

    .character-select.exit-right .char-head:nth-child(3) {
      animation-delay: 0.16s;
    }

    @keyframes characterExitRight {
      from {
        opacity: 1;
        transform: translateX(0) scale(1);
      }

      to {
        opacity: 0;
        transform: translateX(140vw) scale(0.8);
      }
    }

    /* HIDDEN DURING TRANSITION */

    .character-select.hidden-for-transition .char-head {
      opacity: 0 !important;
      visibility: hidden !important;
      animation: none !important;
      transform: none !important;
    }

    /* =========================================================
       RETEP HEAD
    ========================================================= */

    body.retep .char-head {
      border-color: #650000;

      animation:
        retepHead 0.15s infinite alternate;

      filter:
        drop-shadow(0 0 12px rgba(255, 0, 0, 0.8))
        drop-shadow(0 8px 20px rgba(0, 0, 0, 1));
    }

    @keyframes retepHead {
      from {
        transform: translateX(-2px) rotate(-1deg);
      }

      to {
        transform: translateX(2px) rotate(1deg);
      }
    }

    /* =========================================================
       GENERATE WRAPPER
    ========================================================= */

    .generate-wrapper {
      background: rgba(20, 20, 20, 0.35);

      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);

      padding: 20px 30px;
      border-radius: 20px;

      border: 1px solid rgba(0, 0, 0, 0.45);

      box-shadow:
        0 0 30px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);

      display: flex;
      flex-direction: column;
      align-items: center;

      margin-top: 10px;
      margin-bottom: 10px;

      width: fit-content;
      min-width: 280px;
      box-sizing: border-box;
    }

    /* =========================================================
       GENERATE BUTTON
    ========================================================= */

    .generate-btn-img {
      width: 220px;
      height: auto;
      cursor: pointer;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease,
        filter 0.2s ease;

      filter:
        drop-shadow(2px 0 0 #000)
        drop-shadow(-2px 0 0 #000)
        drop-shadow(0 2px 0 #000)
        drop-shadow(0 -2px 0 #000)
        drop-shadow(0 10px 20px rgba(0, 0, 0, 0.95));
    }

    .generate-btn-img:hover {
      transform: scale(1.05);

      filter:
        drop-shadow(3px 0 0 #000)
        drop-shadow(-3px 0 0 #000)
        drop-shadow(0 3px 0 #000)
        drop-shadow(0 -3px 0 #000)
        drop-shadow(0 14px 28px rgba(0, 0, 0, 1));
    }

    .generate-btn-img.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    /* =========================================================
       VIDEO
    ========================================================= */

    video {
      width: 110%;
      max-width: 520px;
      border-radius: 8px;
      margin-top: 0;
      margin-bottom: 2px;
      background: #000;
      display: none;
      order: 1;

      box-shadow:
        0 0 0 2px #000,
        0 12px 28px rgba(0, 0, 0, 0.9);
    }

    /* =========================================================
       STATUS
    ========================================================= */

    #status {
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;

      text-shadow:
        -1.5px -1.5px 0 #000,
        1.5px -1.5px 0 #000,
        -1.5px 1.5px 0 #000,
        1.5px 1.5px 0 #000,
        0 4px 10px rgba(0, 0, 0, 1);
    }

    #retepProgress {
      display: none;
      margin-top: 8px;
      font-size: 14px;
      font-weight: bold;
      color: #fff;

      text-shadow:
        -1.5px -1.5px 0 #000,
        1.5px -1.5px 0 #000,
        -1.5px 1.5px 0 #000,
        1.5px 1.5px 0 #000,
        0 4px 10px rgba(0, 0, 0, 1);
    }

    #buttonContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      position: relative;
      order: 2;
      margin-top: 2px;
      transition: margin-top 0.2s ease;
    }

    #buttonContainer.video-visible {
      margin-top: 2px;
    }

    /* =========================================================
       FAKE ERROR
    ========================================================= */

    #evilError {
      display: none;
      margin-top: 12px;
      max-width: 340px;

      font-family: monospace;
      font-size: 13px;
      line-height: 1.5;

      color: #ff4444;

      text-shadow:
        0 0 5px #ff0000,
        0 0 10px rgba(255, 0, 0, 0.5);

      user-select: none;
    }

    .evil-letter {
      cursor: pointer;
      font-weight: normal;
      color: #ff0000;

      text-shadow:
        0 0 5px #ff0000,
        0 0 12px #ff0000;

      transition:
        color 0.15s ease,
        text-shadow 0.15s ease,
        transform 0.15s ease;
    }

    .evil-letter:hover {
      color: #fff;

      text-shadow:
        0 0 8px #fff,
        0 0 18px #ff0000;

      transform: scale(1.25);
      display: inline-block;
    }

    #evilError.complete {
      animation: errorGlitch 0.08s infinite alternate;
    }

    @keyframes errorGlitch {
      from {
        transform: translateX(-2px);
      }

      to {
        transform: translateX(2px);
      }
    }

    /* =========================================================
       RETEP MESSAGE
    ========================================================= */

    #evilMessage {
      display: none;
      margin-top: 12px;
      color: #ff0000;

      font-family: monospace;
      font-weight: 900;
      font-size: 18px;

      text-shadow:
        0 0 5px #ff0000,
        0 0 15px #ff0000,
        0 0 30px #000;

      animation: evilText 0.08s infinite alternate;
    }

    @keyframes evilText {
      from {
        transform: translateX(-1px);
      }

      to {
        transform: translateX(2px);
      }
    }

    /* =========================================================
       RETEP POPUPS
    ========================================================= */

    #popupContainer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1000;
      overflow: hidden;
    }

    .retep-popup {
      position: absolute;
      width: 260px;

      background: #d9d9d9;
      border: 2px solid #111;

      box-shadow:
        6px 6px 0 rgba(0, 0, 0, 0.75),
        0 0 25px rgba(255, 0, 0, 0.35);

      animation:
        popupAppear 0.15s ease-out,
        popupShake 0.12s infinite alternate;

      pointer-events: none;
    }

    .popup-titlebar {
      height: 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 6px;
      box-sizing: border-box;

      background: #111;
      color: #fff;

      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: bold;

      border-bottom: 2px solid #000;
    }

    .popup-buttons {
      display: flex;
      gap: 3px;
    }

    .popup-button {
      width: 14px;
      height: 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #777;
      color: #fff;
      border: 1px solid #000;

      font-size: 9px;
      line-height: 1;
    }

    .popup-body {
      padding: 8px;
      background: #222;
      color: #fff;

      font-family: monospace;
      font-size: 10px;
      text-align: left;
    }

    .popup-image {
      width: 100%;
      height: auto;
      display: block;
      margin-bottom: 7px;
      border: 1px solid #000;
    }

    .popup-text {
      color: #ff3333;

      text-shadow:
        0 0 5px #ff0000;

      word-break: break-word;
    }

    @keyframes popupAppear {
      0% {
        opacity: 0;
        transform:
          scale(0.4)
          rotate(-8deg);
      }

      70% {
        opacity: 1;
        transform:
          scale(1.05)
          rotate(2deg);
      }

      100% {
        opacity: 1;
        transform:
          scale(1)
          rotate(0deg);
      }
    }

    @keyframes popupShake {
      from {
        margin-left: -1px;
      }

      to {
        margin-left: 1px;
      }
    }

    .retep-popup.removing {
      animation:
        popupDisappear 0.2s ease-in forwards;
    }

    @keyframes popupDisappear {
      from {
        opacity: 1;
        transform: scale(1);
      }

      to {
        opacity: 0;
        transform:
          scale(0.2)
          rotate(10deg);
      }
    }

    /* =========================================================
       RETEP STATIC
    ========================================================= */

    body.retep::after {
      content: "";
      position: fixed;
      inset: 0;

      pointer-events: none;
      z-index: 2;
      opacity: 0.16;

      background:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.06) 0px,
          rgba(255,255,255,0.06) 1px,
          rgba(0,0,0,0.1) 1px,
          rgba(0,0,0,0.1) 3px
        );

      animation:
        staticLines 0.06s steps(2) infinite;
    }

    @keyframes staticLines {
      0% {
        transform: translateY(0);
      }

      25% {
        transform: translateY(3px);
      }

      50% {
        transform: translateY(-2px);
      }

      75% {
        transform: translateY(1px);
      }

      100% {
        transform: translateY(-3px);
      }
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {
      #siteLogo {
        width: 390px;
        max-width: 60vw;
      }

      .character-select {
        left: 12px;
        right: auto;
        gap: 12px;
      }

      .character-select.side-right {
        left: auto;
        right: 12px;
      }

      .char-head {
        width: 75px;
        height: 75px;
      }
    }
  </style>
</head>

<body class="family_guy">

  <!-- =========================================================
       LOGO
  ========================================================= -->

  <img
    id="siteLogo"
    src="logo.png"
    alt="The Griffin Machine"
  >

  <!-- =========================================================
       MAIN
  ========================================================= -->

  <div class="container">

    <!-- CHARACTER SELECT -->

    <div
      class="character-select"
      id="characterSelect"
    >

      <img
        id="head-family"
        src="clips/family_guy/head.png"
        alt="Family Guy"
        class="char-head active"

    <!-- DEBUG PANEL -->
    <div id="debugPanel" style="position:fixed;left:8px;right:8px;bottom:8px;max-height:30vh;overflow:auto;background:rgba(0,0,0,0.7);color:#0f0;padding:8px;font-family:monospace;font-size:12px;border-radius:6px;z-index:100000;white-space:pre-wrap;display:none"></div>
    <button id="debugToggle" style="position:fixed;right:12px;bottom:calc(30vh + 18px);z-index:100001;padding:6px 8px;border-radius:6px;background:#222;color:#fff;border:1px solid #444;display:none">Logs</button>
        onclick="selectShow('family_guy', this)"
      >

      <img
        id="head-cleveland"
        src="clips/cleveland_show/head.png"
        alt="Cleveland Show"
        class="char-head"
        onclick="selectShow('cleveland_show', this)"
      >

      <img
        id="head-custom"
        src="clips/custom/head.png"
        alt="Custom"
        class="char-head"
        onclick="selectShow('custom', this)"
      >

    </div>

    <!-- VIDEO PLAYER -->

    <video
      id="player"
      controls
      playsinline
    ></video>

    <!-- GENERATE -->

    <div id="buttonContainer">

      <div class="generate-wrapper">

        <img
          id="generateBtn"
          src="generate_btn_family_guy.png"
          alt="Generate"
          class="generate-btn-img"
          onclick="playMashup()"
        >

        <div id="status"></div>

        <div id="retepProgress"></div>

        <div id="evilError"></div>

        <div id="evilMessage">
          RETEP HAS AWAKENED
        </div>

      </div>

    </div>

  </div>

  <!-- =========================================================
       RETEP POPUPS
  ========================================================= -->

  <div id="popupContainer"></div>

  <!-- =========================================================
       RETEP AUDIO
  ========================================================= -->

  <audio
    id="retepAudio"
    src="clips/retep/retep.mp3"
    loop
    preload="auto"
  ></audio>

  <audio
    id="retepLaugh"
    src="clips/retep/laugh.mp3"
    preload="auto"
  ></audio>

  <audio
    id="retepError"
    src="clips/retep/error.mp3"
    preload="auto"
  ></audio>


  <!-- =========================================================
       JAVASCRIPT
  ========================================================= -->

  <script type="module">

    import { FFmpeg } from "./ffmpeg/lib/index.js";

    import {
      fetchFile,
      toBlobURL
    } from "./ffmpeg/util/index.js";

    // Wrap fetchFile to detect Git LFS pointer files (common cause on GitHub Pages)
    async function safeFetchFile(url) {
      const data = await fetchFile(url);

      try {
        // Check if the response is actually a Git LFS pointer (text file)
        const header = new TextDecoder().decode(data.slice(0, 64));
        if (header.includes('git-lfs.github.com') || header.includes('version https://git-lfs.github.com')) {
          throw new Error(`File appears to be a Git LFS pointer (not the real media). GitHub Pages does not serve LFS objects. URL: ${url}`);
        }
      } catch (e) {
        // If decoding fails, ignore and return raw data
      }

      return data;
    }


    /* =========================================================
       GLOBAL STATE
    ========================================================= */

    let currentShow = "family_guy";

    let ffmpegLoaded = false;

    // Optional remote base URL for clips. If set (or passed as ?remote=),
    // clip URLs will be resolved against this base instead of the local
    // `clips/` folder. Useful for GitHub Pages where LFS objects are not served.
    let REMOTE_CLIP_BASE = "";

    try {
      const params = new URLSearchParams(window.location.search);
      const remoteParam = params.get('remote') || params.get('remote_base');
      if (remoteParam) {
        REMOTE_CLIP_BASE = remoteParam;
      }
    } catch (e) {
      // ignore
    }

    function buildClipUrl(folder, subpath) {
      if (REMOTE_CLIP_BASE) {
        return REMOTE_CLIP_BASE.replace(/\/$/, '') + '/' + folder + '/' + subpath;
      }
      return 'clips/' + folder + '/' + subpath;
    }

    // If REMOTE_CLIP_BASE points to a zip archive, provide a way to fetch
    // and extract it into ffmpeg's FS so subsequent fetches can read files
    // directly from the virtual FS. This avoids many network requests and
    // circumvents Git LFS pointer issues on Pages.
    let _remoteZipExtracted = false;
    async function ensureRemoteZipExtracted(url) {
      if (_remoteZipExtracted) return;
      if (!url) return;

      // load JSZip if needed
      if (typeof window.JSZip === 'undefined') {
        await new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });
      }

      const status = document.getElementById('status');
      try {
        if (status) status.textContent = 'Downloading clips archive...';
        const resp = await fetch(url);
        if (!resp.ok) throw new Error('Could not download clips archive: ' + resp.status);
        const ab = await resp.arrayBuffer();

        if (status) status.textContent = 'Extracting clips...';

        const zip = await window.JSZip.loadAsync(ab);
        const entries = Object.keys(zip.files);
        for (const name of entries) {
          const file = zip.files[name];
          if (file.dir) continue;
          // Only extract files under clips/
          if (!name.startsWith('clips/')) continue;
          const data = await file.async('uint8array');
          try {
            await ffmpeg.writeFile(name, data);
          } catch (e) {
            // ignore write errors
            console.warn('Could not write extracted file to FFmpeg FS:', name, e && e.message);
          }
        }

        _remoteZipExtracted = true;
        if (status) status.textContent = '';
      } catch (e) {
        console.error('Failed to extract remote clips zip', e);
        if (status) status.textContent = 'Failed to download clips archive';
        throw e;
      }
    }

    /* =========================================================
       GET VIDEO DURATION
       ---------------------------------------------------------
       Used to reject accidentally uploaded long
       compilation files.
    ========================================================= */

    function getVideoDuration(src) {

      return new Promise(
        (resolve, reject) => {

          const video =
            document.createElement(
              "video"
            );

          let finished = false;

          const cleanup = () => {

            video.removeAttribute(
              "src"
            );

            video.load();

          };


          const timeout =
            setTimeout(() => {

              if (finished) {
                return;
              }

              finished = true;

              cleanup();

              reject(
                new Error(
                  "Timed out while reading video duration"
                )
              );

            }, 15000);


          video.preload =
            "metadata";

          video.muted = true;


          video.onloadedmetadata =
            () => {

              if (finished) {
                return;
              }

              finished = true;

              clearTimeout(
                timeout
              );

              const duration =
                video.duration;

              cleanup();

              if (
                !Number.isFinite(duration) ||
                duration <= 0
              ) {

                reject(
                  new Error(
                    "Invalid video duration"
                  )
                );

                return;
              }

              resolve(
                duration
              );

            };


          video.onerror =
            () => {

              if (finished) {
                return;
              }

              finished = true;

              clearTimeout(
                timeout
              );

              cleanup();

              reject(
                new Error(
                  "Could not read video metadata"
                )
              );

            };


          video.src = src;

        }
      );

    }


    /* =========================================================
       FIND VALID RANDOM CLIP
       ---------------------------------------------------------
       Cleveland clips are checked before being downloaded
       into FFmpeg.

       Bad 20-minute compilations are rejected.
    ========================================================= */

    async function getValidRandomClip(
      config,
      type
    ) {

      /*
        Maximum allowed duration.

        Only Cleveland gets this strict check.
      */

      const maxDuration =
        config.folder === "cleveland_show"
          ? 60
          : Infinity;


      const count =
        type === "start"
          ? config.startCount
          : config.endCount;


      /*
        Make a randomized list of all possible
        clip numbers.

        This means we don't keep randomly picking
        the same invalid file.
      */

      const numbers =
        Array.from(
          {
            length: count
          },
          (_, index) =>
            index + 1
        );


      for (
        let i = numbers.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (i + 1)
          );

        [
          numbers[i],
          numbers[j]
        ] =
        [
          numbers[j],
          numbers[i]
        ];

      }


      /*
        Try every available clip until
        one passes validation.
      */

      for (const number of numbers) {

        const filename = ((type === "start") ? "S" : "E") + number + ".mp4";
        const fullPath = buildClipUrl(config.folder, type + '/' + filename);


        /*
          Cleveland duration check.
        */

        if (
          Number.isFinite(
            maxDuration
          )
        ) {

          try {

            const duration =
              await getVideoDuration(
                fullPath
              );


            console.log(
              `${fullPath} duration: ${duration.toFixed(2)}s`
            );


            if (
              duration >
              maxDuration
            ) {

              console.warn(
                `Rejected ${fullPath} because it is ${duration.toFixed(2)}s long. Maximum is ${maxDuration}s.`
              );

              continue;

            }

          }

          catch (error) {

            console.warn(
              `Could not validate ${fullPath}:`,
              error
            );

            /*
              Reject the file if metadata cannot be read.
              This is safer than accidentally allowing
              an unknown file through.
            */

            continue;

          }

        }


        /*
          Valid file found.
        */

        return {
          number,
          path: fullPath
        };

      }


      /*
        Nothing valid was found.
      */

      throw new Error(
        `No valid ${type} clips were found for ${config.folder}.`
      );

    }

    /* =========================================================

    ========================================================= */

    function handleEvilLetter(event) {

      if (evilMode) {
        return;
      }


      const clicked =
        event.target.dataset.letter;


      const sequence = [
        "e",
        "v",
        "i",
        "l"
      ];


      if (
        clicked ===
        sequence[
          evilSequencePosition
        ]
      ) {

        event.target.style.color =
          "#ffffff";

        event.target.style.textShadow =
          "0 0 8px #fff, 0 0 20px #ff0000";


        evilSequencePosition++;


        if (
          evilSequencePosition ===
          sequence.length
        ) {

          activateEvilMode();

        }


        return;

      }


      evilSequencePosition =
        0;


      event.target.animate(
        [
          {
            transform:
              "translateX(-5px)"
          },
          {
            transform:
              "translateX(5px)"
          },
          {
            transform:
              "translateX(-5px)"
          },
          {
            transform:
              "translateX(0)"
          }
        ],
        {
          duration: 180
        }
      );

    }

          // restore logos and buttons
          try {
            document.getElementById('siteLogo').src = showLibrary.family_guy.logo;
            document.getElementById('generateBtn').src = showLibrary.family_guy.buttonImg;
          } catch (e) {}

          // restore heads
          try {
            const hf = document.getElementById('head-family');
            const hc = document.getElementById('head-cleveland');
            const hu = document.getElementById('head-custom');
            if (hf) { hf.src = 'clips/family_guy/head.png'; hf.classList.add('active'); }
            if (hc) { hc.src = 'clips/cleveland_show/head.png'; hc.classList.remove('active'); }
            if (hu) { hu.src = 'clips/custom/head.png'; hu.classList.remove('active'); }
          } catch (e) {}

          try {
            document.getElementById('status').textContent = '';
            const error = document.getElementById('evilError');
            if (error) { error.classList.remove('complete'); error.innerHTML = ''; }
            const msg = document.getElementById('evilMessage'); if (msg) msg.style.display = 'none';
          } catch (e) {}

        }, 2200);

      } catch (e) {
        console.error('showScreamer error', e);
      }

    }


    /* =========================================================
       NORMAL GENERATION
    ========================================================= */

    async function generateNormalVideo(
      config
    ) {

      /*
        R1 override.
      */

      if (
        config.folder === "family_guy" &&
        rarityConfig.family_guy &&
        rarityConfig.family_guy.rareChance === 1
      ) {

        console.log(
          "Rare override enabled; playing R1.mp4."
        );


        const rarePath = buildClipUrl('family_guy', 'rare/R1.mp4');

        await ffmpeg.writeFile(
          "rare.mp4",
          await safeFetchFile(
            rarePath
          )
        );


        return "rare.mp4";

      }


      /*
        Find a valid start clip.
      */

      const startClip =
        await getValidRandomClip(
          config,
          "start"
        );


      /*
        Find a valid end clip.
      */

      const endClip =
        await getValidRandomClip(
          config,
          "end"
        );


      console.log(
        "Start clip:",
        startClip.path
      );


      console.log(
        "End clip:",
        endClip.path
      );

      // compute expected duration: start is trimmed to 2.5s
      let expectedDuration = 2.5;
      try {
        const endDur = await getVideoDuration(endClip.path);
        expectedDuration += endDur;
        console.log('Expected final duration (s):', expectedDuration.toFixed(2));
      } catch (e) {
        console.warn('Could not probe end clip duration for expectation:', e && e.message);
      }


      /*
        Download selected clips
        into FFmpeg.
      */

      await ffmpeg.writeFile(
        "start.mp4",
        await safeFetchFile(
          startClip.path
        )
      );


      await ffmpeg.writeFile(
        "end.mp4",
        await safeFetchFile(
          endClip.path
        )
      );


      /*
        Concatenation list.
      */

      await ffmpeg.writeFile(
        "inputs.txt",
        new TextEncoder().encode(
          "file 'start.mp4'\n" +
          "file 'end.mp4'\n"
        )
      );


      /*
        Stitch the two clips.
      */

      await ffmpeg.exec([
        "-f",
        "concat",

        "-safe",
        "0",

        "-i",
        "inputs.txt",

        "-c",
        "copy",

        "-movflags",
        "+faststart",

        "merged.mp4"
      ]);


      return "merged.mp4";

    }


    /* =========================================================
       RETEP GENERATION
    ========================================================= */

    async function generateRetepVideo(
      config
    ) {

      // ensure we don't start generation if locked
      if (retepLocked) {
        console.log('generateRetepVideo aborted: retepLocked=true');
        // signal caller by throwing so playMashup can handle gracefully
        throw new Error('Retep is locked');
      }

      console.log('generateRetepVideo start', { retepGenCount, retepLocked, config });

      const progressEl =
        document.getElementById(
          "retepProgress"
        );


      const updateProgress = (
        value,
        label = ""
      ) => {

        progressEl.style.display =
          "block";

        progressEl.textContent =
          label
            ? value + "% — " + label
            : value + "%";

      };


      updateProgress(
        10,
        "loading start clip"
      );

      // If remote base is a zip archive, extract it into FFmpeg FS so files
      // can be read directly without hitting GitHub Pages LFS pointers.
      if (REMOTE_CLIP_BASE && REMOTE_CLIP_BASE.toLowerCase().endsWith('.zip')) {
        try {
          await ensureRemoteZipExtracted(REMOTE_CLIP_BASE);
        } catch (e) {
          console.warn('Could not extract remote clips zip:', e && e.message);
        }
      }

      // Try multiple candidates for start clip to avoid missing files
      const startFile = "retep_start.mp4";
      let startNumber = null;
      for (let attempt = 0; attempt < Math.max(3, config.startCount); attempt++) {
        const candidate = getRandomInt(config.startCount);
        const url = buildClipUrl(config.folder, 'start/S' + candidate + '.mp4');
        try {
          console.log('fetch start', url);

          // If we extracted a remote zip, prefer the file from FFmpeg FS
          const internalPath = 'clips/' + config.folder + '/start/S' + candidate + '.mp4';
          if (_remoteZipExtracted) {
            try {
              const existing = ffmpeg.FS.readFile(internalPath);
              await ffmpeg.writeFile(startFile, existing);
              startNumber = candidate;
              break;
            } catch (e) {
              // not present, fall back to network
            }
          }

          const data = await safeFetchFile(url);
          await ffmpeg.writeFile(startFile, data);
          startNumber = candidate;
          break;
        } catch (err) {
          console.warn('start clip fetch failed', url, err && err.message);
        }
      }
      if (startNumber === null) {
        throw new Error('No valid start clip for ' + config.folder);
      }

      updateProgress(
        40,
        "loading end clip"
      );

      const endFile = "retep_end.mp4";
      let endNumber = null;
      for (let attempt = 0; attempt < Math.max(3, config.endCount); attempt++) {
        const candidate = getRandomInt(config.endCount);
        const url = buildClipUrl(config.folder, 'end/E' + candidate + '.mp4');
        try {
          console.log('fetch end', url);

          const internalPath = 'clips/' + config.folder + '/end/E' + candidate + '.mp4';
          if (_remoteZipExtracted) {
            try {
              const existing = ffmpeg.FS.readFile(internalPath);
              await ffmpeg.writeFile(endFile, existing);
              endNumber = candidate;
              break;
            } catch (e) {
              // not present, fall back to network
            }
          }

          const data = await safeFetchFile(url);
          await ffmpeg.writeFile(endFile, data);
          endNumber = candidate;
          break;
        } catch (err) {
          console.warn('end clip fetch failed', url, err && err.message);
        }
      }
      if (endNumber === null) {
        throw new Error('No valid end clip for ' + config.folder);
      }

      updateProgress(
        60,
        "normalizing clip timing"
      );
      // finalFile will point to the chosen output when a fast path succeeds
      let finalFile = null;
      // Try a fast concat copy (no re-encode). If inputs are compatible this is much faster.
      try {
        updateProgress(65, 'attempting fast concat');

        await ffmpeg.writeFile(
          'inputs.txt',
          new TextEncoder().encode("file 'retep_start.mp4'\nfile 'retep_end.mp4'\n")
        );

        try {
          await ffmpeg.exec([
            '-f',
            'concat',
            '-safe',
            '0',
            '-i',
            'inputs.txt',
            '-c',
            'copy',
            '-movflags',
            '+faststart',
            'retep_fast.mp4'
          ]);

            // If fast concat succeeded, use it
            updateProgress(95, 'finalizing (fast)');
            try {
              // copy to final name
              await ffmpeg.exec(['-i', 'retep_fast.mp4', '-c', 'copy', 'retep_final.mp4']);
            } catch (e) {
              // ignore rename failure
            }

            finalFile = 'retep_final.mp4';
            // we successfully created a final file via fast concat — skip heavy re-encode
            console.log('Fast concat produced', finalFile);
            updateProgress(100, 'finalizing (fast)');
            // skip the rest of the processing
            

        } catch (err) {
          console.warn('Fast concat failed, falling back to re-encode', err && err.message);
          // continue to full re-encode path
        }

      } catch (e) {
        console.warn('Fast concat attempt encountered error', e && e.message);
      }

      // If fast concat failed, try normalizing both inputs to a consistent
      // codec/frame-rate/resolution and then concat-copy those normalized files.
      try {
        updateProgress(70, 'normalizing inputs for safe concat');

        // Normalize start (trim to 2.5s, enforce 30fps, scale, encode)
        await ffmpeg.exec([
          '-i', 'retep_start.mp4',
          '-vf', 'scale=320:-2,fps=30',
          '-t', '2.5',
          '-c:v', 'libx264',
          '-preset', 'ultrafast',
          '-crf', '28',
          '-pix_fmt', 'yuv420p',
          '-c:a', 'aac',
          '-b:a', '64k',
          '-ac', '2',
          'retep_start_norm.mp4'
        ]);

        // Normalize end (full length, enforce 30fps, scale, encode)
        await ffmpeg.exec([
          '-i', 'retep_end.mp4',
          '-vf', 'scale=320:-2,fps=30',
          '-c:v', 'libx264',
          '-preset', 'ultrafast',
          '-crf', '28',
          '-pix_fmt', 'yuv420p',
          '-c:a', 'aac',
          '-b:a', '64k',
          '-ac', '2',
          'retep_end_norm.mp4'
        ]);

        updateProgress(85, 'concatting normalized files');

        await ffmpeg.writeFile('inputs.txt', new TextEncoder().encode("file 'retep_start_norm.mp4'\nfile 'retep_end_norm.mp4'\n"));

        await ffmpeg.exec([
          '-f', 'concat',
          '-safe', '0',
          '-i', 'inputs.txt',
          '-c', 'copy',
          '-movflags', '+faststart',
          'retep_final.mp4'
        ]);

        updateProgress(95, 'finalizing (normalized concat)');

        finalFile = 'retep_final.mp4';
        console.log('Normalized concat produced', finalFile);
        updateProgress(95, 'finalizing (normalized concat)');
        // skip the heavy filter_complex step below since we already have a valid output
        

      } catch (normErr) {
        console.warn('Normalized concat attempt failed, falling back to filter_complex re-encode', normErr && normErr.message);
        // continue to the filter_complex re-encode path below
      }

      // Only run the heavy filter_complex path if we haven't already produced a final file
      if (!finalFile) {
        // Debug: ensure the expected files are present in FFmpeg's virtual FS
        try {
          if (ffmpeg && ffmpeg.FS) {
            const rootFiles = ffmpeg.FS.readdir('/');
            console.log('FFmpeg FS root files before exec:', rootFiles);
            if (!rootFiles.includes('retep_start.mp4') || !rootFiles.includes('retep_end.mp4')) {
              console.error('Missing expected files in FFmpeg FS:', rootFiles);
              throw new Error('Missing input files for ffmpeg exec');
            }
          }
        } catch (e) {
          console.error('FFmpeg FS check failed', e);
          throw e;
        }

        await ffmpeg.exec([
        "-fflags",
        "+genpts",
        "-avoid_negative_ts",
        "make_zero",
        "-i",
        "retep_start.mp4",

        "-fflags",
        "+genpts",
        "-avoid_negative_ts",
        "make_zero",
        "-i",
        "retep_end.mp4",

        "-filter_complex",

        "[0:v]trim=0:2.5,setpts=PTS-STARTPTS,scale=320:-2[v0];" +

        "[1:v]setpts=PTS-STARTPTS,scale=320:-2[v1];" +

        "[0:a]atrim=0:2.5,asetpts=PTS-STARTPTS[a0];" +

        "[1:a]asetpts=PTS-STARTPTS[a1];" +

        "[v0][a0][v1][a1]concat=n=2:v=1:a=1[outv][outa];" +

        "[outv]fps=30,format=yuv420p[outv2]",

        "-map",
        "[outv2]",

        "-map",
        "[outa]",

        "-vsync",
        "2",

        "-c:v",
        "libx264",

        "-preset",
        "ultrafast",

        "-crf",
        "54",

        "-b:v",
        "18k",

        "-pix_fmt",
        "yuv420p",

        "-c:a",
        "aac",

        "-b:a",
        "8k",

        "-ac",
        "2",

        "-movflags",
        "+faststart",

        "-r",
        "30",

        "retep_final.mp4"
      ]);

        // mark finalFile as the produced output from filter_complex
        finalFile = 'retep_final.mp4';

      } else {
        console.log('Skipping filter_complex; using existing', finalFile);
      }


      updateProgress(
        100,
        "finalizing"
      );

      // Validate output duration; if it's wildly longer than expected, re-encode to fix timestamps
      try {
        if (!finalFile) finalFile = 'retep_final.mp4';

        const data = await ffmpeg.readFile(finalFile);
        const blob = new Blob([data], { type: 'video/mp4' });
        const url = URL.createObjectURL(blob);

        try {
          const actual = await getVideoDuration(url);
          console.log('Actual final duration (s):', actual.toFixed(2));

          // If actual duration is more than 30% larger or more than expected + 4s, consider it broken
          if (expectedDuration && (actual > expectedDuration * 1.3 || actual > expectedDuration + 4)) {
            console.warn('Final duration is unexpected; re-encoding to fix timestamps');

            await ffmpeg.exec([
              '-i',
              finalFile,
              '-fflags',
              '+genpts',
              '-r',
              '30',
              '-c:v',
              'libx264',
              '-preset',
              'ultrafast',
              '-crf',
              '28',
              '-pix_fmt',
              'yuv420p',
              '-c:a',
              'aac',
              '-b:a',
              '64k',
              '-ac',
              '2',
              '-movflags',
              '+faststart',
              'retep_final_fixed.mp4'
            ]);

            finalFile = 'retep_final_fixed.mp4';
          }
        } finally {
          URL.revokeObjectURL(url);
        }

        return finalFile;

      } catch (e) {
        console.warn('Duration validation failed:', e && e.message);
        return finalFile || 'retep_final.mp4';
      }

    }


    /* =========================================================
       PLAY MASHUP
    ========================================================= */

    async function playMashup() {

      const btn =
        document.getElementById(
          "generateBtn"
        );


      const player =
        document.getElementById(
          "player"
        );


      const status =
        document.getElementById(
          "status"
        );


      /* BOB'S BURGERS / EVIL SEQUENCE */

      if (
        currentShow === "custom" &&
        !evilMode
      ) {

        showFakeError();

        return;

      }


      /* DISABLE BUTTON */

      btn.classList.add(
        "disabled"
      );


      document
        .getElementById(
          "buttonContainer"
        )
        .classList.remove(
          "video-visible"
        );


      btn.style.pointerEvents =
        "none";


      try {

        console.log('playMashup start', { currentShow, evilMode, retepLocked, retepGenCount });

        // If Retep is selected but locked, avoid attempting generation
        if (currentShow === 'retep' && retepLocked) {
          status.textContent = 'Retep is locked. Refresh to re-enable.';
          btn.classList.remove('disabled');
          btn.style.pointerEvents = 'auto';
          return;
        }

        /* LOAD FFMPEG ONCE */

        await loadFFmpeg();


        /* RELOAD RARITY CONFIG */

        await loadRarityConfig();


        let outputFile;


        /* RETEP */

        if (evilMode) {

          status.textContent =
            "";


          outputFile =
            await generateRetepVideo(
              showLibrary.retep
            );

            console.log('generateRetepVideo returned', { outputFile });

        }


        /* NORMAL */

        else {

          status.textContent =
            currentShow === "cleveland_show"
              ? "Checking clips..."
              : "Downloading clips...";


          outputFile =
            await generateNormalVideo(
              showLibrary[
                currentShow
              ]
            );

          console.log('generateNormalVideo returned', { outputFile });

        }


        /* READ OUTPUT */

        status.textContent =
          "";

        


        const data =
          await ffmpeg.readFile(
            outputFile
          );


        const blob =
          new Blob(
            [data],
            {
              type: "video/mp4"
            }
          );


        const mergedURL =
          URL.createObjectURL(
            blob
          );


        /*
          Replace previous object URL.
        */

        if (
          player.dataset.objectUrl
        ) {

          URL.revokeObjectURL(
            player.dataset.objectUrl
          );

        }


        player.dataset.objectUrl =
          mergedURL;


        player.src =
          mergedURL;


        player.style.display =
          "block";


        document
          .getElementById(
            "buttonContainer"
          )
          .classList.add(
            "video-visible"
          );


        player.load();


        /* AUTOPLAY */

        try {

          await player.play();

        }

        catch (err) {

          console.log(
            "Autoplay blocked.",
            err
          );

        }


        // After successful playback, count this generation for Retep
        if (evilMode && currentShow === "retep") {
          retepGenCount = Math.min(5, retepGenCount + 1);

          // increase audio volume step
          try {
            const audioEl = document.getElementById('retepAudio');
            if (audioEl) {
              const baseVolume = 0.12;
              const step = 0.16;
              audioEl.volume = Math.min(1, baseVolume + (retepGenCount * step));
            }
          } catch (e) {}

          // spawn a few extra popups proportional to new count
          try {
            const times = Math.max(0, retepGenCount - 1);
            for (let i = 0; i < times; i++) setTimeout(() => createRetepPopup(), 300 + i * 150);
          } catch (e) {}

          // If we reached the cap, show screamer and lock Retep
          if (retepGenCount >= 5) {
            retepLocked = true;
            await new Promise(r => setTimeout(r, 900));
            showScreamer();
          }

        }

        status.textContent =
          "";

      }


      catch (error) {

        console.error(
          "FFmpeg error:",
          error
        );



        if (!evilMode) {

          status.textContent =
            "Error creating video. Check the console.";

        }

        else {

          // show useful status when evil generation fails
          status.textContent = "Error creating Retep video. Check console.";

        }

      }


      finally {

        const retepProgress =
          document.getElementById(
            "retepProgress"
          );


        retepProgress.style.display =
          "none";


        retepProgress.textContent =
          "";


        btn.classList.remove(
          "disabled"
        );


        btn.style.pointerEvents =
          "auto";

      }

    }


    /* =========================================================
       GLOBAL FUNCTIONS
    ========================================================= */

    window.selectShow =
      selectShow;


    window.playMashup =
      playMashup;


    /* =========================================================
       INITIALIZATION
    ========================================================= */

    loadRarityConfig();

    // Simple on-screen debug capture
    (function() {
      const panel = document.getElementById('debugPanel');
      const toggle = document.getElementById('debugToggle');
      function append(type, args) {
        try {
          const msg = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
          const el = document.createElement('div');
          el.textContent = '[' + type.toUpperCase() + '] ' + msg;
          panel.appendChild(el);
          panel.scrollTop = panel.scrollHeight;
        } catch (e) {}
      }

      const origLog = console.log;
      const origWarn = console.warn;
      const origError = console.error;

      console.log = function(...args) { append('log', args); origLog.apply(console, args); };
      console.warn = function(...args) { append('warn', args); origWarn.apply(console, args); };
      console.error = function(...args) { append('error', args); origError.apply(console, args); };

      toggle.addEventListener('click', () => {
        if (panel.style.display === 'none') panel.style.display = 'block'; else panel.style.display = 'none';
      });

      // Allow toggling the debug panel with Ctrl+Shift+L
      document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.shiftKey && (e.key === 'L' || e.key === 'l')) {
          try { toggle.click(); } catch (ex) {}
        }
      });

      // If the URL contains ?debug=1, show the panel initially
      try {
        const params = new URLSearchParams(window.location.search);
        if (params.get('debug') === '1') {
          panel.style.display = 'block';
        }
      } catch (e) {}

    })();

    // Ensure clicks work even if overlays cover elements: add robust listeners
    (function() {
      try {
        const map = {
          'head-family': 'family_guy',
          'head-cleveland': 'cleveland_show',
          'head-custom': 'custom'
        };

        document.querySelectorAll('.char-head').forEach(el => {
          el.addEventListener('click', (e) => {
            try {
              e.stopPropagation();
              const showKey = map[el.id] || el.dataset.show || 'family_guy';
              console.log('char-head clicked:', el.id, '->', showKey);
              selectShow(showKey, el);
            } catch (err) {
              console.error('char-head listener error', err);
            }
          }, { passive: true });
        });
      } catch (e) { console.warn('char-head listener init failed', e); }
    })();

    // Defensive cleanup: remove any stray text nodes that look like
    // printed onclick attributes inside the character select area.
    (function() {
      try {
        const cs = document.getElementById('characterSelect');
        if (cs) {
          const toRemove = [];
          for (const node of Array.from(cs.childNodes)) {
            if (node.nodeType === Node.TEXT_NODE) {
              const txt = node.textContent.trim();
              if (txt && (txt.includes('onclick=') || txt.includes('selectShow('))) {
                toRemove.push(node);
              }
            }
          }
          toRemove.forEach(n => n.parentNode && n.parentNode.removeChild(n));
        }
      } catch (e) { console.warn('cleanup error', e); }
    })();

  </script>
