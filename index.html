<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Griffin Machine</title>

  <style>
    /* =========================================================
       BASE
    ========================================================= */

    body {
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      transition: background 0.8s ease-in-out;
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      overflow-x: hidden;
    }

    /* =========================================================
       NORMAL BACKGROUNDS
    ========================================================= */

    body.family_guy {
      background-color: #0074D9;
      background-image: url("images/bg_family_guy.jpg");
      background-position: center bottom;
    }

    body.cleveland_show {
      background-color: #FFDC00;
      color: #111;
      background-image: url("images/bg_cleveland.jpg");
      background-position: center bottom;
    }

    body.custom {
      background-color: #005c22;
      color: #111;
      background-image: url("images/bg_custom.jpg");
      background-position: center bottom;
    }

    /* =========================================================
       RETEP BACKGROUND
    ========================================================= */

    body.retep {
      background-color: #000;

      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.25),
          rgba(0, 0, 0, 0.25)
        ),
        url("images/bg_retep.jpg");

      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;

      animation:
        retepBackgroundShake 0.08s infinite,
        retepBackgroundFlicker 0.13s infinite alternate;
    }

    @keyframes retepBackgroundShake {
      0% {
        background-position: calc(50% - 3px) calc(100% + 2px);
      }

      20% {
        background-position: calc(50% + 4px) calc(100% - 3px);
      }

      40% {
        background-position: calc(50% - 5px) calc(100% + 4px);
      }

      60% {
        background-position: calc(50% + 3px) calc(100% + 5px);
      }

      80% {
        background-position: calc(50% - 4px) calc(100% - 2px);
      }

      100% {
        background-position: calc(50% + 2px) calc(100% + 3px);
      }
    }

    @keyframes retepBackgroundFlicker {
      0% {
        filter: brightness(0.75) contrast(1.15) saturate(1.1);
      }

      10% {
        filter: brightness(1.05) contrast(1.5) saturate(1.6);
      }

      11% {
        filter: brightness(0.3) contrast(2) saturate(2);
      }

      22% {
        filter: brightness(0.85) contrast(1.3) saturate(1.3);
      }

      34% {
        filter: brightness(1.15) contrast(1.7) saturate(1.8);
      }

      35% {
        filter: brightness(0.2) contrast(2.2) saturate(2);
      }

      50% {
        filter: brightness(0.8) contrast(1.4) saturate(1.5);
      }

      63% {
        filter: brightness(1.1) contrast(1.7) saturate(1.8);
      }

      64% {
        filter: brightness(0.35) contrast(2) saturate(2);
      }

      80% {
        filter: brightness(0.7) contrast(1.4) saturate(1.5);
      }

      100% {
        filter: brightness(0.6) contrast(1.5) saturate(1.6);
      }
    }

    /* =========================================================
       LOGO
    ========================================================= */

    #siteLogo {
      width: 507px;
      max-width: 63vw;
      height: auto;
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      pointer-events: none;

      filter:
        drop-shadow(0 5px 10px rgba(0, 0, 0, 0.9))
        drop-shadow(0 0 15px rgba(0, 0, 0, 0.6));

      transition:
        opacity 0.25s ease,
        filter 0.25s ease;
    }

    body.retep #siteLogo {
      animation: retepLogoGlitch 0.1s infinite alternate;
    }

    @keyframes retepLogoGlitch {
      from {
        transform: translateX(calc(-50% - 2px)) skewX(-1deg);
      }

      to {
        transform: translateX(calc(-50% + 2px)) skewX(1deg);
      }
    }

    /* =========================================================
       MAIN CONTAINER
    ========================================================= */

    .container {
      background: transparent;
      padding: 160px 30px 20px;
      text-align: center;
      color: #fff;
      max-width: 540px;
      width: 92%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 5;
    }

    /* =========================================================
       CHARACTER SELECT
    ========================================================= */

    .character-select {
      position: fixed;
      left: 25px;
      right: auto;
      top: 50%;
      transform: translateY(-50%);

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;

      gap: 20px;
      margin: 0;
      z-index: 15;
      pointer-events: none;
    }

    .char-head {
      width: 110px;
      height: 110px;
      flex-shrink: 0;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
      pointer-events: auto;

      border: 1px solid rgba(0, 0, 0, 0.45);
      background: rgba(20, 20, 20, 0.083);

      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);

      filter:
        drop-shadow(0 0 10px rgba(0, 0, 0, 0.364))
        drop-shadow(0 8px 16px rgba(0, 0, 0, 1));

      transition:
        border-color 0.3s ease,
        filter 0.3s ease;

      opacity: 1;
    }

    .char-head:hover {
      transform: scale(1.15);

      filter:
        drop-shadow(0 0 14px rgba(0, 0, 0, 1))
        drop-shadow(0 12px 24px rgba(0, 0, 0, 1));
    }

    .char-head.active {
      border-color: rgba(255, 255, 255, 0.8);

      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.35),
        0 0 12px rgba(255, 255, 255, 0.28),
        0 0 22px rgba(255, 255, 255, 0.18);

      filter:
        drop-shadow(0 0 10px rgba(0, 0, 0, 0.364))
        drop-shadow(0 0 18px rgba(255, 255, 255, 0.32))
        drop-shadow(0 8px 16px rgba(0, 0, 0, 1));
    }

    /* =========================================================
       CHARACTER SLIDE SYSTEM
    ========================================================= */

    .character-select.side-right {
      left: auto;
      right: 25px;
    }

    .character-select.transitioning {
      pointer-events: none;
    }

    /* ENTER FROM LEFT */

    .character-select.enter-left .char-head {
      animation-name: characterEnterLeft;
      animation-duration: 0.48s;
      animation-timing-function: cubic-bezier(0.2, 0.9, 0.25, 1);
      animation-fill-mode: both;
    }

    .character-select.enter-left .char-head:nth-child(1) {
      animation-delay: 0s;
    }

    .character-select.enter-left .char-head:nth-child(2) {
      animation-delay: 0.12s;
    }

    .character-select.enter-left .char-head:nth-child(3) {
      animation-delay: 0.24s;
    }

    @keyframes characterEnterLeft {
      from {
        opacity: 0;
        transform: translateX(-140vw) scale(0.8);
      }

      70% {
        opacity: 1;
      }

      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    /* ENTER FROM RIGHT */

    .character-select.enter-right .char-head {
      animation-name: characterEnterRight;
      animation-duration: 0.48s;
      animation-timing-function: cubic-bezier(0.2, 0.9, 0.25, 1);
      animation-fill-mode: both;
    }

    .character-select.enter-right .char-head:nth-child(1) {
      animation-delay: 0s;
    }

    .character-select.enter-right .char-head:nth-child(2) {
      animation-delay: 0.12s;
    }

    .character-select.enter-right .char-head:nth-child(3) {
      animation-delay: 0.24s;
    }

    @keyframes characterEnterRight {
      from {
        opacity: 0;
        transform: translateX(140vw) scale(0.8);
      }

      70% {
        opacity: 1;
      }

      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    /* EXIT TO LEFT */

    .character-select.exit-left .char-head {
      animation-name: characterExitLeft;
      animation-duration: 0.38s;
      animation-timing-function: cubic-bezier(0.65, 0, 0.85, 0.2);
      animation-fill-mode: forwards;
    }

    .character-select.exit-left .char-head:nth-child(1) {
      animation-delay: 0s;
    }

    .character-select.exit-left .char-head:nth-child(2) {
      animation-delay: 0.08s;
    }

    .character-select.exit-left .char-head:nth-child(3) {
      animation-delay: 0.16s;
    }

    @keyframes characterExitLeft {
      from {
        opacity: 1;
        transform: translateX(0) scale(1);
      }

      to {
        opacity: 0;
        transform: translateX(-140vw) scale(0.8);
      }
    }

    /* EXIT TO RIGHT */

    .character-select.exit-right .char-head {
      animation-name: characterExitRight;
      animation-duration: 0.38s;
      animation-timing-function: cubic-bezier(0.65, 0, 0.85, 0.2);
      animation-fill-mode: forwards;
    }

    .character-select.exit-right .char-head:nth-child(1) {
      animation-delay: 0s;
    }

    .character-select.exit-right .char-head:nth-child(2) {
      animation-delay: 0.08s;
    }

    .character-select.exit-right .char-head:nth-child(3) {
      animation-delay: 0.16s;
    }

    @keyframes characterExitRight {
      from {
        opacity: 1;
        transform: translateX(0) scale(1);
      }

      to {
        opacity: 0;
        transform: translateX(140vw) scale(0.8);
      }
    }

    /* HIDDEN DURING TRANSITION */

    .character-select.hidden-for-transition .char-head {
      opacity: 0 !important;
      visibility: hidden !important;
      animation: none !important;
      transform: none !important;
    }

    /* =========================================================
       RETEP HEAD
    ========================================================= */

    body.retep .char-head {
      border-color: #650000;

      animation:
        retepHead 0.15s infinite alternate;

      filter:
        drop-shadow(0 0 12px rgba(255, 0, 0, 0.8))
        drop-shadow(0 8px 20px rgba(0, 0, 0, 1));
    }

    @keyframes retepHead {
      from {
        transform: translateX(-2px) rotate(-1deg);
      }

      to {
        transform: translateX(2px) rotate(1deg);
      }
    }

    /* =========================================================
       GENERATE WRAPPER
    ========================================================= */

    .generate-wrapper {
      background: rgba(20, 20, 20, 0.35);

      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);

      padding: 20px 30px;
      border-radius: 20px;

      border: 1px solid rgba(0, 0, 0, 0.45);

      box-shadow:
        0 0 30px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);

      display: flex;
      flex-direction: column;
      align-items: center;

      margin-top: 10px;
      margin-bottom: 10px;

      width: fit-content;
      min-width: 280px;
      box-sizing: border-box;
    }

    /* =========================================================
       GENERATE BUTTON
    ========================================================= */

    .generate-btn-img {
      width: 220px;
      height: auto;
      cursor: pointer;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease,
        filter 0.2s ease;

      filter:
        drop-shadow(2px 0 0 #000)
        drop-shadow(-2px 0 0 #000)
        drop-shadow(0 2px 0 #000)
        drop-shadow(0 -2px 0 #000)
        drop-shadow(0 10px 20px rgba(0, 0, 0, 0.95));
    }

    .generate-btn-img:hover {
      transform: scale(1.05);

      filter:
        drop-shadow(3px 0 0 #000)
        drop-shadow(-3px 0 0 #000)
        drop-shadow(0 3px 0 #000)
        drop-shadow(0 -3px 0 #000)
        drop-shadow(0 14px 28px rgba(0, 0, 0, 1));
    }

    .generate-btn-img.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    /* =========================================================
       VIDEO
    ========================================================= */

    video {
      width: 110%;
      max-width: 520px;
      border-radius: 8px;
      margin-top: 0;
      margin-bottom: 2px;
      background: #000;
      display: none;
      order: 1;

      box-shadow:
        0 0 0 2px #000,
        0 12px 28px rgba(0, 0, 0, 0.9);
    }

    /* =========================================================
       STATUS
    ========================================================= */

    #status {
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;

      text-shadow:
        -1.5px -1.5px 0 #000,
        1.5px -1.5px 0 #000,
        -1.5px 1.5px 0 #000,
        1.5px 1.5px 0 #000,
        0 4px 10px rgba(0, 0, 0, 1);
    }

    #retepProgress {
      display: none;
      margin-top: 8px;
      font-size: 14px;
      font-weight: bold;
      color: #fff;

      text-shadow:
        -1.5px -1.5px 0 #000,
        1.5px -1.5px 0 #000,
        -1.5px 1.5px 0 #000,
        1.5px 1.5px 0 #000,
        0 4px 10px rgba(0, 0, 0, 1);
    }

    #buttonContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      position: relative;
      order: 2;
      margin-top: 2px;
      transition: margin-top 0.2s ease;
    }

    #buttonContainer.video-visible {
      margin-top: 2px;
    }

    /* =========================================================
       FAKE ERROR
    ========================================================= */

    #evilError {
      display: none;
      margin-top: 12px;
      max-width: 340px;

      font-family: monospace;
      font-size: 13px;
      line-height: 1.5;

      color: #ff4444;

      text-shadow:
        0 0 5px #ff0000,
        0 0 10px rgba(255, 0, 0, 0.5);

      user-select: none;
    }

    .evil-letter {
      cursor: pointer;
      font-weight: normal;
      color: #ff0000;

      text-shadow:
        0 0 5px #ff0000,
        0 0 12px #ff0000;

      transition:
        color 0.15s ease,
        text-shadow 0.15s ease,
        transform 0.15s ease;
    }

    .evil-letter:hover {
      color: #fff;

      text-shadow:
        0 0 8px #fff,
        0 0 18px #ff0000;

      transform: scale(1.25);
      display: inline-block;
    }

    #evilError.complete {
      animation: errorGlitch 0.08s infinite alternate;
    }

    @keyframes errorGlitch {
      from {
        transform: translateX(-2px);
      }

      to {
        transform: translateX(2px);
      }
    }

    /* =========================================================
       RETEP MESSAGE
    ========================================================= */

    #evilMessage {
      display: none;
      margin-top: 12px;
      color: #ff0000;

      font-family: monospace;
      font-weight: 900;
      font-size: 18px;

      text-shadow:
        0 0 5px #ff0000,
        0 0 15px #ff0000,
        0 0 30px #000;

      animation: evilText 0.08s infinite alternate;
    }

    @keyframes evilText {
      from {
        transform: translateX(-1px);
      }

      to {
        transform: translateX(2px);
      }
    }

    /* =========================================================
       RETEP POPUPS
    ========================================================= */

    #popupContainer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1000;
      overflow: hidden;
    }

    .retep-popup {
      position: absolute;
      width: 260px;

      background: #d9d9d9;
      border: 2px solid #111;

      box-shadow:
        6px 6px 0 rgba(0, 0, 0, 0.75),
        0 0 25px rgba(255, 0, 0, 0.35);

      animation:
        popupAppear 0.15s ease-out,
        popupShake 0.12s infinite alternate;

      pointer-events: none;
    }

    .popup-titlebar {
      height: 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 6px;
      box-sizing: border-box;

      background: #111;
      color: #fff;

      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: bold;

      border-bottom: 2px solid #000;
    }

    .popup-buttons {
      display: flex;
      gap: 3px;
    }

    .popup-button {
      width: 14px;
      height: 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #777;
      color: #fff;
      border: 1px solid #000;

      font-size: 9px;
      line-height: 1;
    }

    .popup-body {
      padding: 8px;
      background: #222;
      color: #fff;

      font-family: monospace;
      font-size: 10px;
      text-align: left;
    }

    .popup-image {
      width: 100%;
      height: auto;
      display: block;
      margin-bottom: 7px;
      border: 1px solid #000;
    }

    .popup-text {
      color: #ff3333;

      text-shadow:
        0 0 5px #ff0000;

      word-break: break-word;
    }

    @keyframes popupAppear {
      0% {
        opacity: 0;
        transform:
          scale(0.4)
          rotate(-8deg);
      }

      70% {
        opacity: 1;
        transform:
          scale(1.05)
          rotate(2deg);
      }

      100% {
        opacity: 1;
        transform:
          scale(1)
          rotate(0deg);
      }
    }

    @keyframes popupShake {
      from {
        margin-left: -1px;
      }

      to {
        margin-left: 1px;
      }
    }

    .retep-popup.removing {
      animation:
        popupDisappear 0.2s ease-in forwards;
    }

    @keyframes popupDisappear {
      from {
        opacity: 1;
        transform: scale(1);
      }

      to {
        opacity: 0;
        transform:
          scale(0.2)
          rotate(10deg);
      }
    }

    /* =========================================================
       RETEP STATIC
    ========================================================= */

    body.retep::after {
      content: "";
      position: fixed;
      inset: 0;

      pointer-events: none;
      z-index: 2;
      opacity: 0.16;

      background:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.06) 0px,
          rgba(255,255,255,0.06) 1px,
          rgba(0,0,0,0.1) 1px,
          rgba(0,0,0,0.1) 3px
        );

      animation:
        staticLines 0.06s steps(2) infinite;
    }

    @keyframes staticLines {
      0% {
        transform: translateY(0);
      }

      25% {
        transform: translateY(3px);
      }

      50% {
        transform: translateY(-2px);
      }

      75% {
        transform: translateY(1px);
      }

      100% {
        transform: translateY(-3px);
      }
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {
      #siteLogo {
        width: 390px;
        max-width: 60vw;
      }

      .character-select {
        left: 12px;
        right: auto;
        gap: 12px;
      }

      .character-select.side-right {
        left: auto;
        right: 12px;
      }

      .char-head {
        width: 75px;
        height: 75px;
      }
    }
  </style>
</head>

    async function loadRarityConfig() {

        const configUrl = REMOTE_RARITY_URL
          ? new URL(REMOTE_RARITY_URL)
          : new URL(
              "rarity-config.json",
              import.meta.url
            );

        configUrl.searchParams.set(
          "t",
          Date.now().toString()
        );

        const response = await fetch(
          configUrl,
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            `Could not load rarity config (${response.status})`
          );
        }

        const config =
          await response.json();

        const chance =
          config?.family_guy?.rareChance;

        if (
          typeof chance !== "number" ||
          !Number.isFinite(chance) ||
          chance < 0 ||
          chance > 1
        ) {
          throw new Error(
            "family_guy.rareChance must be a number from 0 to 1"
          );
        }

        rarityConfig =
          config;

        console.log(
          "Rarity config loaded; Family Guy rare chance:",
          chance
        );

      }

      catch (error) {

        console.error(
          "Could not refresh rarity config; using the last known setting:",
          error
        );

      }

    }

    /* =========================================================
       GET VIDEO DURATION
       ---------------------------------------------------------
       Used to reject accidentally uploaded long
       compilation files.
    ========================================================= */

    function getVideoDuration(src) {

      return new Promise(
        (resolve, reject) => {

          const video =
            document.createElement(
              "video"
            );

          let finished = false;

          const cleanup = () => {

            video.removeAttribute(
              "src"
            );

            video.load();

          };


          const timeout =
            setTimeout(() => {

              if (finished) {
                return;
              }

              finished = true;

              cleanup();

              reject(
                new Error(
                  "Timed out while reading video duration"
                )
              );

            }, 15000);


          video.preload =
            "metadata";

          video.muted = true;


          video.onloadedmetadata =
            () => {

              if (finished) {
                return;
              }

              finished = true;

              clearTimeout(
                timeout
              );

              const duration =
                video.duration;

              cleanup();

              if (
                !Number.isFinite(duration) ||
                duration <= 0
              ) {

                reject(
                  new Error(
                    "Invalid video duration"
                  )
                );

                return;
              }

              resolve(
                duration
              );

            };


          video.onerror =
            () => {

              if (finished) {
                return;
              }

              finished = true;

              clearTimeout(
                timeout
              );

              cleanup();

              reject(
                new Error(
                  "Could not read video metadata"
                )
              );

            };


          video.src = src;

        }
      );

    }


    /* =========================================================
       FIND VALID RANDOM CLIP
       ---------------------------------------------------------
       Cleveland clips are checked before being downloaded
       into FFmpeg.

       Bad 20-minute compilations are rejected.
    ========================================================= */

    async function getValidRandomClip(
      config,
      type
    ) {

      /*
        Maximum allowed duration.

        Only Cleveland gets this strict check.
      */

      const maxDuration =
        config.folder === "cleveland_show"
          ? 60
          : Infinity;


      const count =
        type === "start"
          ? config.startCount
          : config.endCount;


      /*
        Make a randomized list of all possible
        clip numbers.

        This means we don't keep randomly picking
        the same invalid file.
      */

      const numbers =
        Array.from(
          {
            length: count
          },
          (_, index) =>
            index + 1
        );


      for (
        let i = numbers.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (i + 1)
          );

        [
          numbers[i],
          numbers[j]
        ] =
        [
          numbers[j],
          numbers[i]
        ];

      }


      /*
        Try every available clip until
        one passes validation.
      */

      for (const number of numbers) {

        const path =
          "clips/" +
          config.folder +
          "/" +
          type +
          "/";

        const filename =
          (
            type === "start"
              ? "S"
              : "E"
          ) +
          number +
          ".mp4";

        const fullPath =
          path +
          filename;


        /*
          Cleveland duration check.
        */

        if (
          Number.isFinite(
            maxDuration
          )
        ) {

          try {

            const duration =
              await getVideoDuration(
                fullPath
              );


            console.log(
              `${fullPath} duration: ${duration.toFixed(2)}s`
            );


            if (
              duration >
              maxDuration
            ) {

              console.warn(
                `Rejected ${fullPath} because it is ${duration.toFixed(2)}s long. Maximum is ${maxDuration}s.`
              );

              continue;

            }

          }

          catch (error) {

            console.warn(
              `Could not validate ${fullPath}:`,
              error
            );

            /*
              Reject the file if metadata cannot be read.
              This is safer than accidentally allowing
              an unknown file through.
            */

            continue;

          }

        }


        /*
          Valid file found.
        */

        return {
          number,
          path: fullPath
        };

      }


      /*
        Nothing valid was found.
      */

      throw new Error(
        `No valid ${type} clips were found for ${config.folder}.`
      );

    }

    /* =========================================================
       NORMAL GENERATION
    ========================================================= */

    async function generateNormalVideo(
      config
    ) {

      /*
        R1 override.
      */

      if (
        config.folder === "family_guy" &&
        rarityConfig.family_guy &&
        rarityConfig.family_guy.rareChance === 1
      ) {

        console.log(
          "Rare override enabled; playing R1.mp4."
        );


        const rarePath =
          "clips/family_guy/rare/R1.mp4";


        await ffmpeg.writeFile(
          "rare.mp4",
          await fetchFile(
            rarePath
          )
        );


        return "rare.mp4";

      }


      /*
        Find a valid start clip.
      */

      const startClip =
        await getValidRandomClip(
          config,
          "start"
        );


      /*
        Find a valid end clip.
      */

      const endClip =
        await getValidRandomClip(
          config,
          "end"
        );


      console.log(
        "Start clip:",
        startClip.path
      );


      console.log(
        "End clip:",
        endClip.path
      );


      /*
        Download selected clips
        into FFmpeg.
      */

      await ffmpeg.writeFile(
        "start.mp4",
        await fetchFile(
          startClip.path
        )
      );


      await ffmpeg.writeFile(
        "end.mp4",
        await fetchFile(
          endClip.path
        )
      );


      /*
        Concatenation list.
      */

      await ffmpeg.writeFile(
        "inputs.txt",
        new TextEncoder().encode(
          "file 'start.mp4'\n" +
          "file 'end.mp4'\n"
        )
      );


      /*
        Stitch the two clips.
      */

      await ffmpeg.exec([
        "-f",
        "concat",

        "-safe",
        "0",

        "-i",
        "inputs.txt",

        "-c",
        "copy",

        "-movflags",
        "+faststart",

        "merged.mp4"
      ]);


      return "merged.mp4";

    }


    /* =========================================================
       RETEP GENERATION
    ========================================================= */

    async function generateRetepVideo(
      config
    ) {

      const progressEl =
        document.getElementById(
          "retepProgress"
        );


      const updateProgress = (
        value,
        label = ""
      ) => {

        progressEl.style.display =
          "block";

        progressEl.textContent =
          label
            ? value + "% — " + label
            : value + "%";

      };


      updateProgress(
        10,
        "loading start clip"
      );


      const startNumber =
        getRandomInt(
          config.startCount
        );


      const startFile =
        "retep_start.mp4";


      await ffmpeg.writeFile(
        startFile,
        await fetchFile(
          "clips/retep/start/S" +
          startNumber +
          ".mp4"
        )
      );


      updateProgress(
        40,
        "loading end clip"
      );


      const endNumber =
        getRandomInt(
          config.endCount
        );


      const endFile =
        "retep_end.mp4";


      await ffmpeg.writeFile(
        endFile,
        await fetchFile(
          "clips/retep/end/E" +
          endNumber +
          ".mp4"
        )
      );


      updateProgress(
        60,
        "normalizing clip timing"
      );


      await ffmpeg.exec([
        "-i",
        "retep_start.mp4",

        "-i",
        "retep_end.mp4",

        "-filter_complex",

        "[0:v]trim=0:2.5,setpts=PTS-STARTPTS,fps=12,scale=320:-2[v0];" +

        "[1:v]setpts=PTS-STARTPTS,fps=12,scale=320:-2[v1];" +

        "[0:a]atrim=0:2.5,asetpts=PTS-STARTPTS[a0];" +

        "[1:a]asetpts=PTS-STARTPTS[a1];" +

        "[v0][a0][v1][a1]concat=n=2:v=1:a=1[outv][outa]",

        "-map",
        "[outv]",

        "-map",
        "[outa]",

        "-c:v",
        "libx264",

        "-preset",
        "ultrafast",

        "-crf",
        "54",

        "-b:v",
        "18k",

        "-pix_fmt",
        "yuv420p",

        "-c:a",
        "aac",

        "-b:a",
        "8k",

        "-ac",
        "2",

        "-movflags",
        "+faststart",

        "retep_final.mp4"
      ]);


      updateProgress(
        100,
        "finalizing"
      );


      return "retep_final.mp4";

    }


    /* =========================================================
       PLAY MASHUP
    ========================================================= */

    async function playMashup() {

      const btn =
        document.getElementById(
          "generateBtn"
        );


      const player =
        document.getElementById(
          "player"
        );


      const status =
        document.getElementById(
          "status"
        );


      /* BOB'S BURGERS / EVIL SEQUENCE */

      if (
        currentShow === "custom" &&
        !evilMode
      ) {

        showFakeError();

        return;

      }


      /* DISABLE BUTTON */

      btn.classList.add(
        "disabled"
      );


      document
        .getElementById(
          "buttonContainer"
        )
        .classList.remove(
          "video-visible"
        );


      btn.style.pointerEvents =
        "none";


      try {

        /* LOAD FFMPEG ONCE */

        await loadFFmpeg();


        /* RELOAD RARITY CONFIG */

        await loadRarityConfig();


        let outputFile;


        /* RETEP */

        if (evilMode) {

          status.textContent =
            "";


          outputFile =
            await generateRetepVideo(
              showLibrary.retep
            );

        }


        /* NORMAL */

        else {

          status.textContent =
            currentShow === "cleveland_show"
              ? "Checking clips..."
              : "Downloading clips...";


          outputFile =
            await generateNormalVideo(
              showLibrary[
                currentShow
              ]
            );

        }


        /* READ OUTPUT */

        status.textContent =
          "";


        const data =
          await ffmpeg.readFile(
            outputFile
          );


        const blob =
          new Blob(
            [data],
            {
              type: "video/mp4"
            }
          );


        const mergedURL =
          URL.createObjectURL(
            blob
          );


        /*
          Replace previous object URL.
        */

        if (
          player.dataset.objectUrl
        ) {

          URL.revokeObjectURL(
            player.dataset.objectUrl
          );

        }


        player.dataset.objectUrl =
          mergedURL;


        player.src =
          mergedURL;


        player.style.display =
          "block";


        document
          .getElementById(
            "buttonContainer"
          )
          .classList.add(
            "video-visible"
          );


        player.load();


        /* AUTOPLAY */

        try {

          await player.play();

        }

        catch (err) {

          console.log(
            "Autoplay blocked.",
            err
          );

        }


        status.textContent =
          "";

      }


      catch (error) {

        console.error(
          "FFmpeg error:",
          error
        );


        if (!evilMode) {

          status.textContent =
            "Error creating video. Check the console.";

        }

        else {

          status.textContent =
            "";

        }

      }


      finally {

        const retepProgress =
          document.getElementById(
            "retepProgress"
          );


        retepProgress.style.display =
          "none";


        retepProgress.textContent =
          "";


        btn.classList.remove(
          "disabled"
        );


        btn.style.pointerEvents =
          "auto";

      }

    }


    /* =========================================================
       GLOBAL FUNCTIONS
    ========================================================= */

    window.selectShow =
      selectShow;


    window.playMashup =
      playMashup;


    /* =========================================================
       INITIALIZATION
    ========================================================= */

    loadRarityConfig();

  </script>
