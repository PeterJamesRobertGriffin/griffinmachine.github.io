<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Griffin Machine</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      transition: background 0.8s ease-in-out;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* BACKGROUND THEMES */
    body.family_guy {
      background-color: #0074D9;
      background-image: url('images/bg_family_guy.jpg');
    }

    body.cleveland_show {
      background-color: #FFDC00;
      color: #111;
      background-image: url('images/bg_cleveland.jpg');
    }

    body.bobs_burgers {
      background-color: #A0D468;
      color: #111;
      background-image: url('images/bg_bobs_burgers.jpg');
    }

    .container {
      background: transparent;
      padding: 30px;
      text-align: center;
      color: #fff;
      max-width: 500px;
      width: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .character-select {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .char-head {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
      border: 5px solid transparent;
      transition: transform 0.3s ease, border-color 0.3s ease, filter 0.3s ease;
      background: #333;
      filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.9)) drop-shadow(0 8px 16px rgba(0, 0, 0, 1));
    }

    .char-head:hover {
      transform: scale(1.15);
      filter: drop-shadow(0 0 14px rgba(0, 0, 0, 1)) drop-shadow(0 12px 24px rgba(0, 0, 0, 1));
    }

    .char-head.active {
      border-color: #202020;
    }

    .generate-wrapper {
      background: rgba(20, 20, 20, 0.35);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      padding: 20px 30px;
      border-radius: 20px;
      border: 1px solid rgba(0, 0, 0, 0.45);
      box-shadow: 
        0 0 30px rgba(0, 0, 0, 0.35), 
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
      margin-bottom: 10px;
      width: fit-content;
      min-width: 280px;
      box-sizing: border-box;
    }

    .generate-btn-img {
      width: 220px;
      height: auto;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease, filter 0.2s ease;
      filter: 
        drop-shadow(2px 0 0 #000) 
        drop-shadow(-2px 0 0 #000) 
        drop-shadow(0 2px 0 #000) 
        drop-shadow(0 -2px 0 #000)
        drop-shadow(0 10px 20px rgba(0, 0, 0, 0.95));
    }

    .generate-btn-img:hover {
      transform: scale(1.05);
      filter: 
        drop-shadow(3px 0 0 #000) 
        drop-shadow(-3px 0 0 #000) 
        drop-shadow(0 3px 0 #000) 
        drop-shadow(0 -3px 0 #000)
        drop-shadow(0 14px 28px rgba(0, 0, 0, 1));
    }

    .generate-btn-img.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    video {
      width: 100%;
      border-radius: 8px;
      margin-top: 10px;
      margin-bottom: 10px;
      background: #000;
      display: none;
      box-shadow: 0 0 0 2px #000, 0 12px 28px rgba(0, 0, 0, 0.9);
    }

    #status {
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      text-shadow: 
        -1.5px -1.5px 0 #000,  
         1.5px -1.5px 0 #000,
        -1.5px  1.5px 0 #000,
         1.5px  1.5px 0 #000,
         0 4px 10px rgba(0, 0, 0, 1);
    }

    #buttonContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
  </style>
</head>
<body class="family_guy">

  <div class="container">
    <div class="character-select">
      <img 
        src="clips/family_guy/head.png" 
        alt="Family Guy" 
        class="char-head active" 
        onclick="selectShow('family_guy', this)"
      >
      <img 
        src="clips/cleveland_show/head.png" 
        alt="Cleveland Show" 
        class="char-head" 
        onclick="selectShow('cleveland_show', this)"
      >
      <img 
        src="clips/bobs_burgers/head.png" 
        alt="Bob's Burgers" 
        class="char-head" 
        onclick="selectShow('bobs_burgers', this)"
      >
    </div>

    <div id="buttonContainer">
      <div class="generate-wrapper">
        <img 
          id="generateBtn" 
          src="generate_btn_family_guy.png" 
          alt="Generate" 
          class="generate-btn-img" 
          onclick="playMashup()"
        >
        <div id="status"></div>
      </div>
    </div>

    <!-- Video Output Player with controls enabled permanently -->
    <video id="player" controls playsinline></video>
  </div>

<script type="module">
  import { FFmpeg } from './ffmpeg/lib/index.js';
  import { fetchFile, toBlobURL } from './ffmpeg/util/index.js';

  let currentShow = 'family_guy';
  let ffmpeg = null;
  let ffmpegLoaded = false;

  const showLibrary = {
    family_guy: {
      folder: 'family_guy',
      startCount: 81,
      endCount: 100,
      buttonImg: 'generate_btn_family_guy.png'
    },

    cleveland_show: {
      folder: 'cleveland_show',
      startCount: 1,
      endCount: 1,
      buttonImg: 'generate_btn_cleveland.png'
    },

    bobs_burgers: {
      folder: 'bobs_burgers',
      startCount: 1,
      endCount: 1,
      buttonImg: 'generate_btn_bobs_burgers.png'
    }
  };

  function selectShow(showKey, element) {
    currentShow = showKey;

    document.body.className = showKey;

    document.querySelectorAll('.char-head').forEach(img => {
      img.classList.remove('active');
    });

    element.classList.add('active');

    document.getElementById('generateBtn').src =
      showLibrary[showKey].buttonImg;
  }

  function getRandomInt(max) {
    return Math.floor(Math.random() * max) + 1;
  }

  async function loadFFmpeg() {
    if (ffmpegLoaded) {
      return;
    }

    const status = document.getElementById('status');

    status.textContent = 'Loading video engine...';

    ffmpeg = new FFmpeg();

    /*
     * FFmpeg core files are now hosted locally
     * by Live Server / GitHub Pages.
     */
    const baseURL = './ffmpeg/core';

    const coreURL = await toBlobURL(
      `${baseURL}/ffmpeg-core.js`,
      'text/javascript'
    );

    const wasmURL = await toBlobURL(
      `${baseURL}/ffmpeg-core.wasm`,
      'application/wasm'
    );

    await ffmpeg.load({
      coreURL,
      wasmURL
    });

    ffmpegLoaded = true;

    status.textContent = '';
  }

  async function playMashup() {
    const btn = document.getElementById('generateBtn');
    const player = document.getElementById('player');
    const status = document.getElementById('status');

    btn.classList.add('disabled');
    btn.style.pointerEvents = 'none';

    try {
      const config = showLibrary[currentShow];

      /*
       * Pick random START and END clips.
       */
      const startNumber = getRandomInt(config.startCount);
      const endNumber = getRandomInt(config.endCount);

      const startPath =
        `clips/${config.folder}/start/S${startNumber}.mp4`;

      const endPath =
        `clips/${config.folder}/end/E${endNumber}.mp4`;

      console.log('Start clip:', startPath);
      console.log('End clip:', endPath);

      /*
       * Load FFmpeg.
       */
      await loadFFmpeg();

      status.textContent = 'Downloading clips...';

      /*
       * Download START clip into FFmpeg.
       */
      await ffmpeg.writeFile(
        'start.mp4',
        await fetchFile(startPath)
      );

      /*
       * Download END clip into FFmpeg.
       */
      await ffmpeg.writeFile(
        'end.mp4',
        await fetchFile(endPath)
      );

      status.textContent = 'Merging clips...';

      /*
       * Tell FFmpeg which files to concatenate.
       */
      await ffmpeg.writeFile(
        'inputs.txt',
        new TextEncoder().encode(
          "file 'start.mp4'\n" +
          "file 'end.mp4'\n"
        )
      );

      /*
       * Merge START + END into ONE MP4.
       *
       * No playback switching is happening here.
       * FFmpeg creates an actual new video file.
       */
      await ffmpeg.exec([
        '-f',
        'concat',
        '-safe',
        '0',
        '-i',
        'inputs.txt',
        '-c',
        'copy',
        'merged.mp4'
      ]);

      status.textContent = 'Preparing video...';

      /*
       * Read the ONE resulting video.
       */
      const data = await ffmpeg.readFile('merged.mp4');

      const blob = new Blob(
        [data.buffer],
        {
          type: 'video/mp4'
        }
      );

      const mergedURL =
        URL.createObjectURL(blob);

      /*
       * Give the player the merged file.
       */
      player.src = mergedURL;
      player.style.display = 'block';

      player.load();

      try {
        await player.play();
      } catch (err) {
        console.log(
          'Autoplay blocked. User interaction required.',
          err
        );
      }

      status.textContent = '';

    } catch (error) {

      console.error('FFmpeg error:', error);

      status.textContent =
        'Error creating video. Check the console.';

    } finally {

      btn.classList.remove('disabled');
      btn.style.pointerEvents = 'auto';
    }
  }

  /*
   * Required because your HTML uses:
   *
   * onclick="selectShow(...)"
   * onclick="playMashup()"
   */
  window.selectShow = selectShow;
  window.playMashup = playMashup;

</script>
</body>
</html>
