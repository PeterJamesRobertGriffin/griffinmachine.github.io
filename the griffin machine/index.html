<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Griffin Machine</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      transition: background 0.8s ease-in-out;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* BACKGROUND THEMES */
    body.family_guy {
      background-color: #0074D9;
      background-image: url('images/bg_family_guy.jpg');
    }

    body.cleveland_show {
      background-color: #FFDC00;
      color: #111;
      background-image: url('images/bg_cleveland.jpg');
    }

    body.bobs_burgers {
      background-color: #A0D468;
      color: #111;
      background-image: url('images/bg_bobs_burgers.jpg');
    }

    .container {
      background: transparent;
      padding: 30px;
      text-align: center;
      color: #fff;
      max-width: 500px;
      width: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .character-select {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .char-head {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
      border: 5px solid transparent;
      transition: transform 0.3s ease, border-color 0.3s ease, filter 0.3s ease;
      background: #333;
      filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.9)) drop-shadow(0 8px 16px rgba(0, 0, 0, 1));
    }

    .char-head:hover {
      transform: scale(1.15);
      filter: drop-shadow(0 0 14px rgba(0, 0, 0, 1)) drop-shadow(0 12px 24px rgba(0, 0, 0, 1));
    }

    .char-head.active {
      border-color: #202020;
    }

    .generate-wrapper {
      background: rgba(20, 20, 20, 0.35);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      padding: 20px 30px;
      border-radius: 20px;
      border: 1px solid rgba(0, 0, 0, 0.45);
      box-shadow: 
        0 0 30px rgba(0, 0, 0, 0.35), 
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
      margin-bottom: 10px;
      width: fit-content;
      min-width: 280px;
      box-sizing: border-box;
    }

    .generate-btn-img {
      width: 220px;
      height: auto;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease, filter 0.2s ease;
      filter: 
        drop-shadow(2px 0 0 #000) 
        drop-shadow(-2px 0 0 #000) 
        drop-shadow(0 2px 0 #000) 
        drop-shadow(0 -2px 0 #000)
        drop-shadow(0 10px 20px rgba(0, 0, 0, 0.95));
    }

    .generate-btn-img:hover {
      transform: scale(1.05);
      filter: 
        drop-shadow(3px 0 0 #000) 
        drop-shadow(-3px 0 0 #000) 
        drop-shadow(0 3px 0 #000) 
        drop-shadow(0 -3px 0 #000)
        drop-shadow(0 14px 28px rgba(0, 0, 0, 1));
    }

    /* We keep the pointer active so you can instantly mash or click it again anytime */
    .generate-btn-img.disabled {
      opacity: 0.7;
    }

    video {
      width: 100%;
      border-radius: 8px;
      margin-top: 10px;
      margin-bottom: 10px;
      background: #000;
      display: none;
      box-shadow: 0 0 0 2px #000, 0 12px 28px rgba(0, 0, 0, 0.9);
    }

    #status {
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      text-shadow: 
        -1.5px -1.5px 0 #000,  
         1.5px -1.5px 0 #000,
        -1.5px  1.5px 0 #000,
         1.5px  1.5px 0 #000,
         0 4px 10px rgba(0, 0, 0, 1);
    }

    #buttonContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
  </style>
</head>
<body class="family_guy">

  <div class="container">
    <div class="character-select">
      <img 
        src="clips/family_guy/head.png" 
        alt="Family Guy" 
        class="char-head active" 
        onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'110\' height=\'110\' viewBox=\'0 0 110 110\'><rect width=\'110\' height=\'110\' fill=\'%230074D9\'/><text x=\'50%\' y=\'55%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'white\' font-family=\'Arial\' font-size=\'24\' font-weight=\'bold\'>FG</text></svg>';"
        onclick="selectShow('family_guy', this)"
      >
      <img 
        src="clips/cleveland_show/head.png" 
        alt="Cleveland Show" 
        class="char-head" 
        onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'110\' height=\'110\' viewBox=\'0 0 110 110\'><rect width=\'110\' height=\'110\' fill=\'%23FFDC00\'/><text x=\'50%\' y=\'55%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'black\' font-family=\'Arial\' font-size=\'24\' font-weight=\'bold\'>CS</text></svg>';"
        onclick="selectShow('cleveland_show', this)"
      >
      <img 
        src="clips/bobs_burgers/head.png" 
        alt="Bob's Burgers" 
        class="char-head" 
        onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'110\' height=\'110\' viewBox=\'0 0 110 110\'><rect width=\'110\' height=\'110\' fill=\'%23A0D468\'/><text x=\'50%\' y=\'55%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'black\' font-family=\'Arial\' font-size=\'24\' font-weight=\'bold\'>BB</text></svg>';"
        onclick="selectShow('bobs_burgers', this)"
      >
    </div>

    <div id="buttonContainer">
      <div class="generate-wrapper">
        <img 
          id="generateBtn" 
          src="generate_btn_family_guy.png" 
          alt="Generate" 
          class="generate-btn-img" 
          onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'220\' height=\'55\'><rect width=\'220\' height=\'55\' rx=\'8\' fill=\'%23ff4757\'/><text x=\'50%\' y=\'55%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'white\' font-family=\'Arial\' font-size=\'18\' font-weight=\'bold\'>GENERATE</text></svg>';"
          onclick="generateAndStitch()"
        >
        <div id="status">Ready</div>
      </div>
    </div>

    <!-- Video Output Player -->
    <video id="player" controls></video>
  </div>

  <script>
    let currentShow = 'family_guy';

    const showLibrary = {
      family_guy: { folder: 'family_guy', startCount: 81, endCount: 100, buttonImg: 'generate_btn_family_guy.png' },
      cleveland_show: { folder: 'cleveland_show', startCount: 1, endCount: 1, buttonImg: 'generate_btn_cleveland.png' },
      bobs_burgers: { folder: 'bobs_burgers', startCount: 1, endCount: 1, buttonImg: 'generate_btn_bobs_burgers.png' }
    };

    function selectShow(showKey, element) {
      currentShow = showKey;
      document.body.className = showKey;
      document.querySelectorAll('.char-head').forEach(img => img.classList.remove('active'));
      element.classList.add('active');
      document.getElementById('generateBtn').src = showLibrary[showKey].buttonImg;
    }

    function getRandomInt(max) {
      return Math.floor(Math.random() * max) + 1;
    }

    function generateAndStitch() {
      const btn = document.getElementById('generateBtn');
      const player = document.getElementById('player');
      const buttonContainer = document.getElementById('buttonContainer');
      const container = document.querySelector('.container');

      const config = showLibrary[currentShow];
      const startPath = `clips/${config.folder}/start/S${getRandomInt(config.startCount)}.mp4`;
      const endPath = `clips/${config.folder}/end/E${getRandomInt(config.endCount)}.mp4`;

      // Instantly reveal player and shift button container under it
      player.style.display = 'block';
      container.appendChild(buttonContainer);
      
      let playlist = [startPath, endPath];
      let currentIndex = 0;

      player.src = playlist[currentIndex];
      player.play().catch(err => console.log(err));

      player.onended = () => {
        currentIndex++;
        if (currentIndex < playlist.length) {
          player.src = playlist[currentIndex];
          player.play().catch(err => console.log(err));
        }
      };
    }
  </script>
</body>
</html>
